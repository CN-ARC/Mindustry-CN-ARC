name: Deployment

on:
  push:
    tags:
      - 'v*'

permissions: {}
jobs:
  deploy:
    permissions:
      contents: write # for release creation (svenstaro/upload-release-action)

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Set env
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    - name: Add Arc release
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "Github Actions"
        git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc
        cd ../Arc
        git tag ${RELEASE_VERSION}
        git push https://Anuken:${{ secrets.API_TOKEN_GITHUB }}@github.com/Anuken/Arc ${RELEASE_VERSION};
        cd ../Mindustry
    - name: Create artifacts
      run: |
        ./gradlew desktop:dist server:dist core:depsJar core:assetsJar core:mergedJavadoc -Pbuildversion=${RELEASE_VERSION:1}
    - name: Update docs
      run: |
        cd ../
        git config --global user.email "cli@github.com"
        git config --global user.name "Github Actions"

        git clone --depth=1 --branch=master https://github.com/RlCCJ/MindustryBuilds
        cd MindustryBuilds
        echo "Updating version to ${RELEASE_VERSION:1}"
        BNUM=$(($GITHUB_RUN_NUMBER + 1000))
        echo versionName=CN-ARC-v7-${RELEASE_VERSION:1}$'\n'versionCode=${BNUM} > version_fdroid.txt
        git add .
        git commit -m "Updating to build ${RELEASE_VERSION:1}"
        git push https://RlCCJ:${{ secrets.API_TOKEN_GITHUB }}@github.com/RlCCJ/MindustryBuilds

    - uses: actions/checkout@v2
    - name: Set env-LC test
      run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
    - name: Update F-Droid build string
      run: |
        git clone --depth=1 --branch=master https://github.com/Jackson11500/Mindustry-CN-ARC-Builds
        cd Mindustry-CN-ARC-Builds
        echo "Updating version to ${RELEASE_VERSION:1}"
        BNUM=$(($GITHUB_RUN_NUMBER + 1000))
        echo versionName=CN-ARC-v7-${RELEASE_VERSION:1}$'\n'versionCode=${BNUM} > version_fdroid.txt
        git add .
        git commit -m "Updating to build ${RELEASE_VERSION:1}"
        git push https://RlCCJ:${{ secrets.API_TOKEN_GITHUB }}@github.com/Anuken/MindustryBuilds
        cd ../Mindustry
    - name: Upload client artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: desktop/build/libs/Mindustry.jar
        tag: ${{ github.ref }}
    - name: Upload server artifacts
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: server/build/libs/server-release.jar
        tag: ${{ github.ref }}

    - name: Upload dependency JAR
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: core/build/libs/core-release-deps.jar
        asset_name: dependencies.jar
        tag: ${{ github.ref }}

    - name: Upload assets JAR
      uses: svenstaro/upload-release-action@v2
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: core/build/libs/core-release-assets.jar
        asset_name: assets.jar
        tag: ${{ github.ref }}